<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar English Kids  Learning Roadmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="screenLogin" class="screen active">
  <div class="login-bg">
    <span class="bubble b1"></span><span class="bubble b2"></span>
    <span class="bubble b3"></span><span class="bubble b4"></span>
    <span class="bubble b5"></span>
  </div>
  <div class="login-card">
    <div class="login-icon"></div>
    <h1 class="login-title">Grammar English Kids</h1>
    <p class="login-sub">Your personal grammar learning roadmap</p>
    <div class="login-form">
      <label class="login-label">What's your name?</label>
      <input id="inputName" class="login-input" type="text" placeholder="Enter your name..." maxlength="30" autocomplete="off">
      <div class="login-level-row">
        <label class="login-label">Choose your level:</label>
        <div class="level-btns">
          <button class="level-btn active" data-level="easy"> Beginner (Ages 6-11)</button>
          <button class="level-btn" data-level="standard"> Standard (Ages 11-15)</button>
        </div>
      </div>
      <button id="btnStart" class="btn-start">Start Learning </button>
    </div>
  </div>
</div>

<!-- MAIN APP WRAPPER -->
<div id="appWrapper" class="screen" style="display:none;">

  <!-- TOP BAR -->
  <header class="topbar">
    <button class="topbar-brand" id="btnHome">
      <span class="topbar-logo"></span>
      <span class="topbar-name">Grammar English Kids</span>
    </button>
    <div class="topbar-right">
      <div class="user-info" id="userInfo">
        <span class="user-avatar"></span>
        <span class="user-name" id="displayName">Student</span>
        <span class="user-level-badge" id="displayLevel">Beginner</span>
      </div>
      <button class="btn-icon" id="btnLogout" title="Logout"></button>
    </div>
  </header>

  <!-- DASHBOARD -->
  <div id="screenDashboard" class="view active">
    <div class="dashboard-hero">
      <div class="dh-text">
        <h2 class="dh-greeting" id="dashGreeting">Hello! </h2>
        <p class="dh-sub">Keep learning every day to complete your grammar journey!</p>
      </div>
      <div class="progress-ring-wrap">
        <svg class="progress-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="50"/>
          <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="50"
                  stroke-dasharray="314" stroke-dashoffset="314"/>
        </svg>
        <div class="ring-label">
          <span class="ring-pct" id="ringPct">0%</span>
          <span class="ring-txt">done</span>
        </div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card"><span class="stat-icon"></span><span class="stat-num" id="statDone">0</span><span class="stat-lbl">Sessions Done</span></div>
      <div class="stat-card"><span class="stat-icon"></span><span class="stat-num" id="statStreak">0</span><span class="stat-lbl">Day Streak</span></div>
      <div class="stat-card"><span class="stat-icon"></span><span class="stat-num" id="statScore">0</span><span class="stat-lbl">Total Score</span></div>
    </div>

    <div class="roadmap-wrap">
      <h3 class="section-title"> Your Learning Roadmap</h3>
      <div class="roadmap" id="roadmapEl"></div>
    </div>
  </div>

  <!-- PHASE DETAIL -->
  <div id="screenPhase" class="view">
    <div class="view-header">
      <button class="btn-back" id="btnBackToDash"> Back to Roadmap</button>
      <div class="phase-header-info" id="phaseHeaderInfo"></div>
    </div>
    <div class="sessions-list" id="sessionsList"></div>
  </div>

  <!-- SESSION -->
  <div id="screenSession" class="view">
    <div class="view-header">
      <button class="btn-back" id="btnBackToPhase"> Back</button>
      <div class="session-header-info" id="sessionHeaderInfo"></div>
      <button class="btn-print" id="btnPrintWorksheet"> Print Worksheet</button>
    </div>
    <div class="lesson-card" id="lessonCard"></div>
    <div class="exercises-wrap" id="exercisesWrap">
      <div class="ex-toolbar">
        <h3 class="ex-title"> Practice Exercises</h3>
        <div class="ex-score" id="exScore">Score: <strong>0 / 0</strong></div>
      </div>
      <div id="exercisesList"></div>
      <div class="ex-check-row">
        <button class="btn-check" id="btnCheckAll"> Check All Answers</button>
        <button class="btn-retry" id="btnRetry" style="display:none;"> Try Again</button>
        <button class="btn-next-session" id="btnNextSession" style="display:none;"> Next Session</button>
      </div>
      <div class="ex-result" id="exResult" style="display:none;"></div>
    </div>
  </div>

</div><!-- end appWrapper -->

<!-- PRINTABLE WORKSHEET (hidden, shown only on print) -->
<div id="worksheetPrint" class="worksheet-print-area"></div>

<script src="js/roadmap-data.js"></script>
<script src="js/exercises-data.js"></script>
<script src="js/app.js"></script>
<script src="js/worksheet.js"></script>
</body>
</html>
